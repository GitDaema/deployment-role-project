name: Mono-Repo Auto Deployment Pipeline

# develop 브랜치에 코드 Push 발생 시 자동 배포 파이프라인 트리거
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Continuous Deployment to AWS EC2
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Actions 서버로 레포지토리 소스 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. SSH를 통해 AWS EC2 서버에 접속하여 자동 배포 명령어 실행
      - name: Execute Remote SSH Commands & Redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/deployment-role-project

            # EC2 내부 Git 로컬 변경점 강제 정돈 (무한 멈춤 완전 예방)
            git reset --hard HEAD
            git checkout develop
            git pull origin develop

            # backend/.env 비밀 파일 자동 동기화
            cat << EOF > backend/.env
            PORT=5000
            DB_HOST=db
            DB_USER=root
            DB_PASSWORD=rootpassword
            DB_NAME=myapp
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            EOF

            # 도커 부분 재배포 및 dangling 이미지 정리
            docker compose up -d --build backend frontend
            docker image prune -f

