# ==============================================================================
# 🛠️ [DevOps 실무 가이드] Nginx 설정 파일 (nginx.conf) 작성 가이드
# ==============================================================================
# 📌 복잡한 프론트엔드/API 환경을 만났을 때 핵심 법칙:
# 1. SPA 라우팅 불변 법칙:
#    - React Router/Vue Router 등을 사용하는 SPA는 사용자가 새로고침(F5)을 누르면 Nginx가 404를 냅니다.
#    - 이를 방지하기 위해 `try_files $uri $uri/ /index.html;` 구문이 반드시 필수입니다!
# 2. API 리버스 프록시 법칙:
#    - 브라우저가 `/api/...`로 보내는 요청을 Docker 내부 백엔드 서비스 포트(`http://backend:5000/api/`)로 전달합니다.
#    - 프론트엔드와 백엔드가 동일한 Nginx 도메인을 타고 들어가므로 **CORS 문제가 완벽히 예방**됩니다!
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # 📌 1. SPA 정적 파일 호스팅 및 새로고침 404 방지
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 📌 2. 백엔드 API 리버스 프록시 (5000번 포트로 릴레이)
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

