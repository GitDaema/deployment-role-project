<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>모노레포 연습 - 메인 페이지</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>🚀 사용자 목록 조회</h1>
    <div id="user-list">로딩 중...</div>

    <script>
        // ==============================================================================
        // 📌 [DevOps 체크포인트 4] 프론트엔드의 API 호출 주소 (relative path 사용 검수)
        // -> ⚠️ 필수 검수: fetch('http://localhost:5000/api/users')처럼 도메인/포트가 하드코딩되어 있다면,
        // -> 운영 서버 배포 시 브라우저에서 CORS 에러 및 접속 불가 장애가 발생합니다.
        // -> 아래처럼 도메인 없이 상대 경로('/api/users')로 작성되어야 Nginx 리버스 프록시가 안전하게 백엔드로 넘겨줍니다.
        // ==============================================================================
        fetch('/api/users')
            .then(res => res.json())
            .then(result => {
                const container = document.getElementById('user-list');
                if (result.success && result.data.length > 0) {
                    container.innerHTML = result.data.map(u =>
                        `<div class="card">
                            <strong>${u.name}</strong> (${u.role}) - ${u.phone}
                        </div>`
                    ).join('');
                } else {
                    container.innerHTML = '<p>등록된 사용자가 없습니다.</p>';
                }
            })
            .catch(err => {
                document.getElementById('user-list').innerHTML = `<p style="color:red;">에러 발생: ${err.message}</p>`;
            });
    </script>
</body>

</html>
