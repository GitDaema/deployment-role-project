<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 챗봇 모노레포 - React</title>
</head>

<body>
  <!-- 
      ==============================================================================
      📌 [1단계 vs 2단계 DevOps 체크포인트 비교]
      ------------------------------------------------------------------------------
      [1단계 시절 (Vanilla HTML)]
      - HTML 파일 내부에서 directamente 스크립트와 UI를 모두 처리함.
      - Nginx가 /usr/share/nginx/html/index.html 을 단순 렌더링함.

      [2단계 승격 (React / Vite SPA)]
      - <div id="root"></div> 와 <script type="module" src="/src/App.jsx"></script> 가 진입점이 됨.
      - Nginx는 직접 이 소스를 실행하지 못하므로, Dockerfile에서 `npm run build`를 수행해 
        생성된 정적 번들 파일(dist/)만 Nginx로 넘겨 호스팅해야 함! (templates/Dockerfile.react 활용)
      ==============================================================================
    -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
